<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFE4E8"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E63946" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad1)"/>

  <!-- Romantic Frame -->
  <rect x="30" y="30" width="740" height="540" rx="20" fill="none" stroke="#FFB6C1" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="45" y="45" width="710" height="510" rx="16" fill="none" stroke="#E63946" stroke-width="1.5" opacity="0.4"/>

  <!-- Decorative Corner Hearts -->
  <g fill="#E63946" opacity="0.6">
    <path d="M 60 70 A 8 8 0 0 0 48 70 A 8 8 0 0 0 36 70 Q 36 82 48 94 Q 60 82 60 70 Z" transform="scale(0.8) translate(30, 30)"/>
    <path d="M 60 70 A 8 8 0 0 0 48 70 A 8 8 0 0 0 36 70 Q 36 82 48 94 Q 60 82 60 70 Z" transform="scale(0.8) translate(910, 30)"/>
    <path d="M 60 70 A 8 8 0 0 0 48 70 A 8 8 0 0 0 36 70 Q 36 82 48 94 Q 60 82 60 70 Z" transform="scale(0.8) translate(30, 660)"/>
    <path d="M 60 70 A 8 8 0 0 0 48 70 A 8 8 0 0 0 36 70 Q 36 82 48 94 Q 60 82 60 70 Z" transform="scale(0.8) translate(910, 660)"/>
  </g>

  <!-- Center Card Illustration -->
  <g transform="translate(400, 260)" filter="url(#shadow1)">
    <!-- Soft Glow Circle -->
    <circle r="90" fill="#FFFFFF" opacity="0.9"/>
    <circle r="80" fill="#FFF0F5" stroke="#FFB6C1" stroke-width="2"/>

    <!-- Heart Symbol -->
    <path d="M 0 -20 C -25 -50 -60 -20 -60 10 C -60 40 0 75 0 85 C 0 85 60 40 60 10 C 60 -20 25 -50 0 -20 Z" fill="#E63946" transform="scale(0.7) translate(0, -25)"/>
    <path d="M 0 -10 C -15 -30 -35 -10 -35 8 C -35 25 0 48 0 54 C 0 54 35 25 35 8 C 35 -10 15 -30 0 -10 Z" fill="#FF85A2" opacity="0.6" transform="scale(0.7) translate(0, -25)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="405" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#000000" text-anchor="middle">
    A Moment I Wish I Could Relive ❤️
  </text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="500" fill="#B91C32" text-anchor="middle">
    Memory #1 • Our Sweet Beginning
  </text>
  <text x="400" y="485" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="middle">
    (Place photo1.jpg in public/photos to display your real photo)
  </text>
</svg>
