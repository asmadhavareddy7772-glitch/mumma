<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF5F7"/>
      <stop offset="100%" stop-color="#FFEBF0"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF69B4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad2)"/>

  <!-- Romantic Frame -->
  <rect x="30" y="30" width="740" height="540" rx="20" fill="none" stroke="#FFB6C1" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="45" y="45" width="710" height="510" rx="16" fill="none" stroke="#E75480" stroke-width="1.5" opacity="0.4"/>

  <!-- Center Card Illustration: Smiling Heart & Sparkles -->
  <g transform="translate(400, 260)" filter="url(#shadow2)">
    <circle r="90" fill="#FFFFFF" opacity="0.9"/>
    <circle r="80" fill="#FFF0F5" stroke="#FFB6C1" stroke-width="2"/>

    <!-- Camera / Smile with Heart Motif -->
    <rect x="-42" y="-24" width="84" height="60" rx="14" fill="#E63946"/>
    <circle cx="0" cy="6" r="18" fill="#FFFFFF"/>
    <circle cx="0" cy="6" r="12" fill="#E63946"/>
    <rect x="-20" y="-34" width="40" height="12" rx="4" fill="#B91C32"/>
    <circle cx="24" cy="-12" r="5" fill="#FFB6C1"/>
  </g>

  <!-- Typography -->
  <text x="400" y="405" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#000000" text-anchor="middle">
    My Favourite Smile
  </text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="500" fill="#B91C32" text-anchor="middle">
    Memory #2 • Radiance & Happiness
  </text>
  <text x="400" y="485" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="middle">
    (Place photo2.jpg in public/photos to display your real photo)
  </text>
</svg>
