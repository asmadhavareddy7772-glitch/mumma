<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF5F7"/>
      <stop offset="100%" stop-color="#FFE4E8"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E75480" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad4)"/>

  <!-- Romantic Frame -->
  <rect x="30" y="30" width="740" height="540" rx="20" fill="none" stroke="#FFB6C1" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="45" y="45" width="710" height="510" rx="16" fill="none" stroke="#FF85A2" stroke-width="1.5" opacity="0.4"/>

  <!-- Sparkles & Rose Motif -->
  <g transform="translate(400, 260)" filter="url(#shadow4)">
    <circle r="90" fill="#FFFFFF" opacity="0.9"/>
    <circle r="80" fill="#FFF0F5" stroke="#FFB6C1" stroke-width="2"/>

    <!-- Blooming Rose Motif -->
    <circle cx="0" cy="5" r="28" fill="#E63946"/>
    <path d="M -15 -10 C -5 -25 15 -25 22 -10 C 28 5 15 20 0 25 C -15 20 -25 5 -15 -10 Z" fill="#B91C32" opacity="0.7"/>
    <circle cx="0" cy="5" r="14" fill="#FF85A2"/>
    <path d="M -8 -8 Q 0 -18 8 -8 Q 12 0 0 8 Q -12 0 -8 -8 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Typography -->
  <text x="400" y="405" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#000000" text-anchor="middle">
    You Make Ordinary Moments Beautiful
  </text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="500" fill="#B91C32" text-anchor="middle">
    Memory #4 • Magic in the Everyday
  </text>
  <text x="400" y="485" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="middle">
    (Place photo4.jpg in public/photos to display your real photo)
  </text>
</svg>
