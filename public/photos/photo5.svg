<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFE4E8"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E63946" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad5)"/>

  <!-- Romantic Frame -->
  <rect x="30" y="30" width="740" height="540" rx="20" fill="none" stroke="#FFB6C1" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="45" y="45" width="710" height="510" rx="16" fill="none" stroke="#E63946" stroke-width="1.5" opacity="0.4"/>

  <!-- Center Heart with Infinite Loop Motif -->
  <g transform="translate(400, 260)" filter="url(#shadow5)">
    <circle r="90" fill="#FFFFFF" opacity="0.9"/>
    <circle r="80" fill="#FFF0F5" stroke="#FFB6C1" stroke-width="2"/>

    <!-- Infinity & Heart -->
    <path d="M -30 0 C -45 -18 -60 0 -30 18 C 0 35 30 0 15 -18 C 0 -35 -30 0 -30 0 Z" fill="none" stroke="#E63946" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30 0 C 45 -18 60 0 30 18 C 0 35 -30 0 -15 -18 C 0 -35 30 0 30 0 Z" fill="none" stroke="#E63946" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#B91C32"/>
  </g>

  <!-- Typography -->
  <text x="400" y="405" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#000000" text-anchor="middle">
    My Favourite Person, Always
  </text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="500" fill="#B91C32" text-anchor="middle">
    Memory #5 • Today, Tomorrow, Forever
  </text>
  <text x="400" y="485" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="middle">
    (Place photo5.jpg in public/photos to display your real photo)
  </text>
</svg>
